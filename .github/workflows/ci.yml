name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --silent --no-audit --no-fund

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck -- --pretty false > typecheck.log 2>&1

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            typecheck.log
            lint.log
            build.log

      - name: Stop on validation failure
        if: steps.typecheck.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
